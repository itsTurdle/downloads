# XcodeGen spec. There is no .xcodeproj in the repo on purpose: a hand-maintained
# project.pbxproj is unreadable and merge-hostile, and CI can regenerate this in a
# second with `xcodegen generate`.

name: LidarStream

options:
  bundleIdPrefix: dev.turdle
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  LidarStream:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LidarStream
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.turdle.lidarstream
        PRODUCT_NAME: LidarStream
        TARGETED_DEVICE_FAMILY: "1,2"     # iPad Pro has LiDAR too
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: NO
        # Built unsigned; Sideloadly applies the signature on the way to the device.
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
    info:
      path: LidarStream/Info.plist
      properties:
        CFBundleDisplayName: LidarStream
        CFBundleShortVersionString: "1.0"
        # iOS 14+ blocks LAN sockets until the user grants Local Network access, and
        # refuses to even prompt without this string. Without it the TCP connect to
        # the desktop bridge silently never completes.
        NSLocalNetworkUsageDescription: >-
          LidarStream sends the depth stream to the viewer running on your computer.
        NSCameraUsageDescription: >-
          LidarStream reads the rear camera and LiDAR depth map to stream them to
          your computer.
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

schemes:
  LidarStream:
    build:
      targets:
        LidarStream: all
    run:
      config: Release
    archive:
      config: Release
